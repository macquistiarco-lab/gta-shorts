<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12052e"/>
    <stop offset="0.30" stop-color="#3a0a5c"/>
    <stop offset="0.48" stop-color="#9c1a6e"/>
    <stop offset="0.58" stop-color="#e8336c"/>
    <stop offset="0.66" stop-color="#ff8a3d"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe66d"/>
    <stop offset="1" stop-color="#ff3d7f"/>
