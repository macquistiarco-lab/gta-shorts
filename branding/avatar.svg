<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12052e"/>
    <stop offset="0.38" stop-color="#4a0d6b"/>
    <stop offset="0.62" stop-color="#d6266f"/>
    <stop offset="0.80" stop-color="#ff7a3d"/>
    <stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe66d"/>
    <stop offset="1" stop-color="#ff3d7f"/>
  </linearGradient>
  <clipPath id="sunclip"><circle cx="512" cy="560" r="300"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<!-- sun with retro stripes -->
<circle cx="512" cy="560" r="330" fill="#ff3d7f" opacity="0.35" filter="url(#soft)"/>
<g clip-path="url(#sunclip)">
  <rect x="200" y="250" width="624" height="620" fill="url(#sun)"/>
  <g fill="#7a1460">
    <rect x="200" y="600" width="624" height="10"/>
    <rect x="200" y="640" width="624" height="16"/>
    <rect x="200" y="684" width="624" height="22"/>
    <rect x="200" y="734" width="624" height="30"/>
    <rect x="200" y="792" width="624" height="40"/>
  </g>
</g>
<!-- ground / sea -->
<rect x="0" y="830" width="1024" height="194" fill="#1a0630"/>
<g stroke="#ff4fa3" stroke-width="3" opacity="0.55">
  <line x1="0" y1="860" x2="1024" y2="860"/>
  <line x1="0" y1="900" x2="1024" y2="900"/>
  <line x1="0" y1="955" x2="1024" y2="955"/>
  <line x1="512" y1="830" x2="512" y2="1024"/>
  <line x1="512" y1="830" x2="250" y2="1024"/>
  <line x1="512" y1="830" x2="774" y2="1024"/>
  <line x1="512" y1="830" x2="0" y2="990"/>
  <line x1="512" y1="830" x2="1024" y2="990"/>
</g>
<!-- palms -->
<g fill="#0c0220">
  <path d="M170 840 C190 700 205 560 250 430 L262 434 C222 560 210 700 198 840 Z"/>
  <g transform="translate(256 432)">
    <path d="M0 0 C-60 -40 -140 -30 -200 20 C-130 -10 -70 -5 0 0Z"/>
    <path d="M0 0 C-40 -70 -110 -110 -180 -100 C-110 -80 -50 -50 0 0Z"/>
    <path d="M0 0 C10 -80 60 -130 120 -140 C70 -100 30 -60 0 0Z"/>
    <path d="M0 0 C60 -40 140 -40 200 0 C130 -20 70 -15 0 0Z"/>
    <path d="M0 0 C50 10 110 50 140 110 C90 60 50 30 0 0Z"/>
    <path d="M0 0 C-50 10 -110 50 -130 110 C-90 60 -50 30 0 0Z"/>
  </g>
  <path d="M866 840 C850 720 835 600 800 500 L788 504 C820 600 836 720 840 840 Z"/>
  <g transform="translate(794 502)">
    <path d="M0 0 C60 -40 140 -30 190 20 C130 -10 70 -5 0 0Z"/>
    <path d="M0 0 C40 -70 110 -100 170 -90 C110 -70 50 -45 0 0Z"/>
    <path d="M0 0 C-10 -80 -60 -120 -115 -130 C-70 -95 -30 -60 0 0Z"/>
    <path d="M0 0 C-60 -40 -140 -40 -190 0 C-130 -20 -70 -15 0 0Z"/>
    <path d="M0 0 C-50 10 -100 50 -125 105 C-85 60 -45 30 0 0Z"/>
    <path d="M0 0 C45 10 100 45 125 100 C85 55 45 28 0 0Z"/>
  </g>
</g>
<!-- neon vertical-clip frame with play button -->
<g filter="url(#glow)">
  <rect x="392" y="318" width="240" height="400" rx="36" fill="#12052e" fill-opacity="0.55" stroke="#29f0ff" stroke-width="16"/>
  <path d="M470 432 L590 518 L470 604 Z" fill="#ff2e9a" stroke="#ffd1ea" stroke-width="8" stroke-linejoin="round"/>
</g>
</svg>
